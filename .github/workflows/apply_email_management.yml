name: Apply email management menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_email_management.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested UI change
        run: python .github/apply_email_management.py

      - name: Commit requested change and clean temporary files
        run: |
          git config user.name "md17ll"
          git config user.email "mhmdmhmdgamel@gmail.com"
          git rm .github/workflows/apply_email_management.yml .github/apply_email_management.py
          git add telegram_bot.py bot_code_export.txt
          git commit -m "إضافة قسم إدارة إيميلاتك"
          git push origin main
