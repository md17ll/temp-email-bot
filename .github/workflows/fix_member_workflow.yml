name: Fix member feature workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_member_workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix the failed replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply_member_features.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          old_limit_keyboard = '''"
          end_marker = "          replace_once(old_limit_keyboard, new_limit_keyboard)\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise RuntimeError('Failed limit replacement block not found')
          end += len(end_marker)

          replacement = '''          limit_start_marker = '    if data == "section_email_limit":\\n'
          limit_end_marker = '    if data == "set_email_limit":\\n'
          limit_start = source.find(limit_start_marker)
          limit_end = source.find(limit_end_marker, limit_start)
          if limit_start == -1 or limit_end == -1:
              raise RuntimeError("Email limit callback block was not found")

          new_limit_section = '''    if data == "section_email_limit":
              if not is_admin(user_id):
                  return
              limit = get_email_limit()
              current = "غير محدود" if limit == 0 else str(limit)
              contact_username = get_admin_contact_username()
              contact_text = f"@{contact_username}" if contact_username else "غير محدد"
              rows = [
                  [InlineKeyboardButton("✏️ تحديد العدد", callback_data="set_email_limit", style="primary")],
              ]
              if user_id == ADMIN_ID:
                  rows.append([
                      InlineKeyboardButton(
                          "🎯 تحديد حد عضو عبر ID",
                          callback_data="set_member_email_limit",
                          style="primary",
                      )
                  ])
              rows.extend([
                  [InlineKeyboardButton("👤 إضافة يوزر التواصل", callback_data="set_admin_contact_username", transparent=True)],
                  [InlineKeyboardButton("♾️ إلغاء الحد", callback_data="clear_email_limit", style="danger")],
                  [InlineKeyboardButton(get_text(lang, "btn_back"), callback_data="admin_panel")],
              ])
              await query.edit_message_text(
                  "🔢 حد إنشاء الإيميلات\\n\\n"
                  f"الحد الحالي لكل مستخدم: {current}\\n"
                  f"يوزر التواصل مع الأدمن: {contact_text}",
                  reply_markup=InlineKeyboardMarkup(rows),
              )
              return

          '''
          source = source[:limit_start] + new_limit_section + source[limit_end:]
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit workflow fix
        shell: bash
        run: |
          rm -f .github/workflows/fix_member_workflow.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add .github/workflows/apply_member_features.yml .github/workflows/fix_member_workflow.yml
          git commit -m "إصلاح خطوة إضافة حد العضو"
          git push origin main
