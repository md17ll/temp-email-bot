name: Apply real Telegram forwarding

on:
  push:
    paths:
      - 'apply_forwarding_style.py'
      - '.github/workflows/apply_forwarding_style.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python apply_forwarding_style.py

      - name: Validate bot syntax
        run: |
          python -m py_compile telegram_bot.py
          git diff --check

      - name: Commit final clean state
        run: |
          rm -f apply_forwarding_style.py
          rm -f .github/workflows/apply_forwarding_style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "تحويل توجيه الرسائل إلى Forward حقيقي"
          git push origin main
