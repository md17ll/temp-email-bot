name: Fix inbox session refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/fix_inbox_session_refresh.py'
      - '.github/workflows/fix_inbox_session_refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply inbox-only fix
        run: python .github/fix_inbox_session_refresh.py

      - name: Validate source
        run: |
          python -c "compile(open('telegram_bot.py', encoding='utf-8').read(), 'telegram_bot.py', 'exec')"
          git diff --check

      - name: Commit confirmed fix and remove temporary files
        run: |
          rm -f .github/fix_inbox_session_refresh.py .github/workflows/fix_inbox_session_refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_bot.py bot_code_export.txt .github/fix_inbox_session_refresh.py .github/workflows/fix_inbox_session_refresh.yml
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "إصلاح تجديد جلسة البريد الوارد"
          git push
