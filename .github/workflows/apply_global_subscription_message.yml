name: Apply global subscription message

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_global_subscription_message.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python apply_global_subscription_message.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('telegram_bot.py').read_text(encoding='utf-8'))
          PY
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_global_subscription_message.py
          rm -f .github/workflows/apply_global_subscription_message.yml
          rm -rf __pycache__
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "توحيد رسالة الاشتراك ومنع تكرارها عند التحقق"
          git push origin main
