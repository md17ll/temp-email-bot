name: Apply create email domain choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_create_email_domain_choice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested change
        run: python apply_create_email_domain_choice.py

      - name: Validate
        run: |
          git diff --check
          python -c "compile(open('telegram_bot.py', encoding='utf-8').read(), 'telegram_bot.py', 'exec')"

      - name: Commit and clean temporary files
        run: |
          git config user.name "md17ll"
          git config user.email "mhmdmhmdgamel@gmail.com"
          git add telegram_bot.py bot_code_export.txt
          git rm apply_create_email_domain_choice.py
          git rm .github/workflows/apply_create_email_domain_choice.yml
          git commit -m "إضافة اختيار الدومين المجاني عند إنشاء الإيميل"
          git push

# rerun after patch-script fix
