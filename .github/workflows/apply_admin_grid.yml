name: Apply admin grid layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_admin_grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python apply_admin_grid.py
          python -m py_compile telegram_bot.py
          rm -rf __pycache__
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_admin_grid.py
          rm -f .github/workflows/apply_admin_grid.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "ترتيب لوحة الأدمن بأزرار شبكية كبيرة"
          git push origin main
