name: Run requested feature update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run_apply_requested_features.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_requested_features.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "    '''    if data == \"section_health\":" : "    r'''    if data == \"section_health\":" ,
              "new_limit_section = '''" : "new_limit_section = r'''",
              "    '''    if data == \"set_member_email_limit\":" : "    r'''    if data == \"set_member_email_limit\":" ,
              "paginated_callbacks = '''" : "paginated_callbacks = r'''",
              "    '''    # اختيار العضو عبر ID" : "    r'''    # اختيار العضو عبر ID",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Missing script pattern: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python apply_requested_features.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('telegram_bot.py').read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Commit result
        run: |
          rm -f apply_requested_features.py
          rm -f .github/workflows/apply_member_features.yml
          rm -f .github/workflows/fix_member_workflow.yml
          rm -f .github/workflows/run_apply_requested_features.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "إضافة صفحات الأعضاء وحالة الخدمات وحد عضو خاص"
          git push origin main
