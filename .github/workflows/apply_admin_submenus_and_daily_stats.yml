name: Apply admin submenus and daily stats

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_admin_submenus_and_daily_stats.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_admin_submenus_and_daily_stats.py')
          text = path.read_text(encoding='utf-8')
          starts = [
              '    if data == "section_stats":',
              '    if data == "section_forward":',
              '    if data == "section_settings":',
              '    if data == "section_broadcast":',
              '    if data == "section_paid_domains":',
              '    if data == "delete_paid_domain":',
              '    if data == "section_email_limit":',
              '    if data == "section_members":',
              '    if data == "section_admins":',
              '    if data == "section_ban":',
              '    if data == "section_welcome":',
          ]
          for start in starts:
              old = "    '''" + start
              new = "    r'''" + start
              if old not in text:
                  raise RuntimeError(f'Missing replacement block: {start}')
              text = text.replace(old, new, 1)
          old = "    '''        buttons = []\n        for a in admins:"
          new = "    r'''        buttons = []\n        for a in admins:"
          if old not in text:
              raise RuntimeError('Missing admin removal replacement block')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply and validate
        run: |
          python apply_admin_submenus_and_daily_stats.py
          python -m py_compile telegram_bot.py
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_admin_submenus_and_daily_stats.py
          rm -f .github/workflows/apply_admin_submenus_and_daily_stats.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "ترتيب أقسام الأدمن وإضافة إحصائيات الاستخدام اليومية"
          git push origin main
