name: Apply confirmed bot changes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_pending_user_changes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes
        run: python .github/apply_pending_user_changes.py

      - name: Validate source and diff
        run: |
          python -c "compile(open('telegram_bot.py', encoding='utf-8').read(), 'telegram_bot.py', 'exec')"
          git diff --check

      - name: Commit changes and remove temporary files
        run: |
          rm -f .github/apply_pending_user_changes.py .github/workflows/apply_pending_user_changes.yml
          git add telegram_bot.py bot_code_export.txt
          git add -A .github
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "تثبيت كلمة السر وحفظ التوجيه ونقل الدومينات المدفوعة"
          git push
