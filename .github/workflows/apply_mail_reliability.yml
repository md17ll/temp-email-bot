name: Apply mail reliability features

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_mail_reliability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python apply_mail_reliability.py
          python -m py_compile telegram_bot.py
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_mail_reliability.py
          rm -f .github/workflows/apply_mail_reliability.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "إضافة تجديد التوكن والحماية وتبديل الدومين تلقائيا"
          git push origin main
