name: Apply multiple subscription channels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_multi_subscription_channels.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python apply_multi_subscription_channels.py
          python -m py_compile telegram_bot.py
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_multi_subscription_channels.py
          rm -f .github/workflows/apply_multi_subscription_channels.yml
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "دعم عدة قنوات للاشتراك الإجباري"
          git push origin main
