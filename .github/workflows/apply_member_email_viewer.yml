name: Apply member email viewer

on:
  push:
    branches: [main]
    paths:
      - 'apply_member_email_viewer.py'
      - '.github/workflows/apply_member_email_viewer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python apply_member_email_viewer.py

      - name: Validate Python syntax
        run: python -c "compile(open('telegram_bot.py', encoding='utf-8').read(), 'telegram_bot.py', 'exec')"

      - name: Verify feature markers
        run: |
          grep -q 'callback_data="member_emails"' telegram_bot.py
          grep -q 'member_inbox_' telegram_bot.py
          grep -q 'member_msg_' telegram_bot.py
          grep -q 'waiting_for == "member_emails_id"' telegram_bot.py

      - name: Commit generated changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm apply_member_email_viewer.py .github/workflows/apply_member_email_viewer.yml
          git add telegram_bot.py bot_code_export.txt
          git commit -m "إضافة عرض إيميلات الأعضاء والبريد الوارد"
          git push
