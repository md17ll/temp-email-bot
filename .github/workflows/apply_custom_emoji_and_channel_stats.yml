name: Apply custom emoji and channel stats

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_custom_emoji_and_channel_stats.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          python apply_custom_emoji_and_channel_stats.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('telegram_bot.py').read_text(encoding='utf-8')
          ast.parse(source)
          assert 'message_custom_emoji_html' in source
          assert 'channel_stats' in source
          assert 'set_channel_message_' not in source
          assert 'application.job_queue' not in source
          print('syntax and invariants OK')
          PY
          git diff --check
          git diff --exit-code -- Procfile requirements.txt runtime.txt

      - name: Commit result
        run: |
          rm -f apply_custom_emoji_and_channel_stats.py
          rm -f .github/workflows/apply_custom_emoji_and_channel_stats.yml
          rm -rf __pycache__
          git config user.name "md17ll"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "دعم الإيموجي المميز وإضافة إحصائيات القنوات"
          git push origin main
