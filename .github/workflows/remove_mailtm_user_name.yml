name: Remove service name from user messages

on:
  push:
    branches: [main]
    paths:
      - '.github/remove_mailtm_user_name.py'
      - '.github/workflows/remove_mailtm_user_name.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply confirmed wording change
        run: python .github/remove_mailtm_user_name.py

      - name: Validate source
        run: |
          python -c "compile(open('telegram_bot.py', encoding='utf-8').read(), 'telegram_bot.py', 'exec')"
          git diff --check
          test ! -d __pycache__

      - name: Remove temporary files and commit
        run: |
          rm -f .github/remove_mailtm_user_name.py
          rm -f .github/workflows/remove_mailtm_user_name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_bot.py bot_code_export.txt .github/remove_mailtm_user_name.py .github/workflows/remove_mailtm_user_name.yml
          git diff --cached --check
          git commit -m "إخفاء اسم خدمة البريد عن رسائل الأعضاء"
          git push
